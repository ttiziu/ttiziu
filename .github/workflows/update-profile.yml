name: Update profile

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
  push:
    paths:
      - generate_profile.py
      - config.yml
      - requirements.txt
      - .github/workflows/update-profile.yml

concurrency:
  group: update-profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore LOC cache
        uses: actions/cache@v4
        with:
          path: cache/stats.json
          key: loc-stats-v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate README
        id: generate
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          USER_NAME: ttiziu
        run: python generate_profile.py

      - name: Commit stats
        env:
          COMMIT_MESSAGE: ${{ steps.generate.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/profile-dark.svg assets/profile-light.svg
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "${COMMIT_MESSAGE:-stats: update profile}"
            git push
          fi
